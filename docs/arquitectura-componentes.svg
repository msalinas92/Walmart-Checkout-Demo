<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1640" viewBox="0 0 1100 1640" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de componentes — Walmart Retail Checkout</title>
  <desc id="desc">Diagrama vertical que muestra el frontend Next.js, backend Spring Boot, Firestore, Pub Sub y BigQuery.</desc>
  <defs>
    <style>
      .title { font: 700 32px Arial, sans-serif; fill: #14213d; }
      .subtitle { font: 16px Arial, sans-serif; fill: #536174; }
      .box-title { font: 700 22px Arial, sans-serif; fill: #14213d; }
      .box-text { font: 16px Arial, sans-serif; fill: #364152; }
      .label { font: 600 14px Arial, sans-serif; fill: #2358a5; }
      .small { font: 14px Arial, sans-serif; fill: #536174; }
      .cloud { font: 700 14px Arial, sans-serif; fill: #fff; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3b72c4"/>
    </marker>
  </defs>

  <rect width="1100" height="1640" fill="#f8fafc"/>
  <text x="550" y="60" text-anchor="middle" class="title">Walmart Retail Checkout</text>
  <text x="550" y="90" text-anchor="middle" class="subtitle">Arquitectura vertical · Cloud Run y ejecución local sobre servicios GCP reales</text>

  <rect x="70" y="120" width="960" height="112" rx="16" fill="#e8f1ff" stroke="#8db4ee" stroke-width="2"/>
  <text x="110" y="163" class="box-title">Cliente / navegador</text>
  <text x="110" y="194" class="box-text">Selecciona productos, medio de pago y confirma la compra.</text>

  <line x1="550" y1="232" x2="550" y2="292" stroke="#3b72c4" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="570" y="270" class="label">HTTPS / JSON</text>

  <rect x="70" y="302" width="960" height="150" rx="16" fill="#eefbf4" stroke="#72b58e" stroke-width="2"/>
  <rect x="70" y="302" width="158" height="32" rx="16" fill="#24834d"/>
  <text x="149" y="324" text-anchor="middle" class="cloud">FRONTEND</text>
  <text x="110" y="372" class="box-title">Next.js · TypeScript · React</text>
  <text x="110" y="402" class="box-text">Rutas / catálogo → /carrito → /checkout · estado persistente.</text>
  <text x="110" y="431" class="small">Vive en: Cloud Run retail-checkout-web · Node.js local.</text>

  <line x1="550" y1="452" x2="550" y2="512" stroke="#3b72c4" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="570" y="490" class="label">REST API</text>

  <rect x="70" y="522" width="960" height="230" rx="16" fill="#fff8e6" stroke="#dda72b" stroke-width="2"/>
  <rect x="70" y="522" width="152" height="32" rx="16" fill="#c98408"/>
  <text x="146" y="544" text-anchor="middle" class="cloud">BACKEND</text>
  <text x="110" y="590" class="box-title">Checkout API · Java 21 · Spring Boot 3</text>
  <text x="110" y="622" class="box-text">Swagger/OpenAPI, validación, CORS e idempotencia.</text>
  <text x="110" y="662" class="box-title">Checkout Orchestrator + Pricing Engine</text>
  <text x="110" y="693" class="box-text">Dominio Java puro: ofertas, promociones configuradas y pago simulado.</text>
  <text x="110" y="727" class="small">Vive en: Cloud Run retail-checkout-api · proceso JVM local.</text>

  <line x1="550" y1="752" x2="550" y2="786" stroke="#3b72c4" stroke-width="3"/>
  <line x1="296" y1="786" x2="804" y2="786" stroke="#3b72c4" stroke-width="3"/>
  <line x1="296" y1="786" x2="296" y2="812" stroke="#3b72c4" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="804" y1="786" x2="804" y2="812" stroke="#3b72c4" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="570" y="778" class="label">batch orden + outbox → evento confirmado</text>

  <rect x="70" y="822" width="452" height="192" rx="16" fill="#f2efff" stroke="#9179da" stroke-width="2"/>
  <text x="110" y="870" class="box-title">Repositorio operacional</text>
  <text x="110" y="902" class="box-text">Productos, promociones, quotes,</text>
  <text x="110" y="928" class="box-text">órdenes, idempotencia y outbox.</text>
  <text x="110" y="974" class="small">Local: Cloud Firestore real</text>
  <text x="110" y="998" class="small">GCP: Cloud Firestore</text>

  <rect x="578" y="822" width="452" height="192" rx="16" fill="#edf7ff" stroke="#5495d4" stroke-width="2"/>
  <text x="618" y="870" class="box-title">Bus de eventos</text>
  <text x="618" y="902" class="box-text">Publica checkout.transaction.v1</text>
  <text x="618" y="928" class="box-text">después de persistir la orden.</text>
  <text x="618" y="974" class="small">Local: Google Pub/Sub real</text>
  <text x="618" y="998" class="small">GCP: Google Pub/Sub</text>

  <line x1="804" y1="1014" x2="804" y2="1102" stroke="#3b72c4" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="824" y="1064" class="label">suscripción administrada</text>

  <rect x="578" y="1112" width="452" height="174" rx="16" fill="#ecfbfa" stroke="#51aaa6" stroke-width="2"/>
  <text x="618" y="1162" class="box-title">Proyección analítica</text>
  <text x="618" y="1194" class="box-text">Valida el contrato JSON y escribe</text>
  <text x="618" y="1220" class="box-text">cada transacción en la tabla cruda.</text>
  <text x="618" y="1256" class="small">Servicio: checkout-analytics-bigquery</text>
  <text x="618" y="1280" class="small">Google Pub/Sub → BigQuery</text>

  <line x1="804" y1="1286" x2="804" y2="1372" stroke="#3b72c4" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="578" y="1382" width="452" height="142" rx="16" fill="#fef2f2" stroke="#dd7d7d" stroke-width="2"/>
  <text x="618" y="1432" class="box-title">Capa analítica</text>
  <text x="618" y="1464" class="box-text">Ventas, promociones, ticket promedio</text>
  <text x="618" y="1490" class="box-text">y medios de pago.</text>
  <text x="618" y="1514" class="small">BigQuery · tabla raw + vista deduplicada</text>

  <rect x="70" y="1550" width="960" height="56" rx="12" fill="#14213d"/>
  <text x="550" y="1585" text-anchor="middle" class="cloud">Desplegado en walmart-demo-511500 · local usa ADC y los mismos servicios reales.</text>
</svg>
