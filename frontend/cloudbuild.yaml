# Aquí recibo la URL pública de la API como sustitución para incluirla en el bundle de Next.js.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=${_NEXT_PUBLIC_API_BASE_URL}
      - --tag
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
substitutions:
  _IMAGE: unused
  _NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
